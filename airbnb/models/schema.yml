models:
  - name: dim_listings_cleansed
    description: "This is the dim_listings_cleansed table, which contains cleansed listing data from the raw_listings source."
    data_tests:
      - minimum_row_count:
          min_row_count: 10000000
          severity: warn

    columns:
      - name: listing_id
        description: "The unique identifier for each listing."
        data_tests:
        - unique
        - not_null

      - name: host_id
        description: "The unique identifier for each host."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id

      - name: room_type
        description: "The type of room available for booking."
        data_tests:
          - accepted_values:
              values: ['Entire home/apt','Private room','Shared room','Hotel room']

      - name: minimum_nights
        description: "The minimum number of nights a guest can stay for booking."
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: "This is the dim_hosts_cleansed table, which contains cleansed host data from the raw_hosts source."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "The unique identifier for each host."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
  
      - name: host_name
        description: "The name of the host."
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: is_superhost
        data_type: boolean  
        data_tests:
          - accepted_values:
              values: [true, false]
              
      - name: updated_at
        data_type: timestamp
      
      - name: created_at
        data_type: timestamp
